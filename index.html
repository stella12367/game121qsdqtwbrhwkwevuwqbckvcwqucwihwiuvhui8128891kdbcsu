<!DOCTYPE html>
<html>
<head>
    <title>Hello, World?</title>
</head>
<body>
    <center>
        <!-- Character Selection Screen -->
        <div id="selection-screen">
            <h1>choose your character</h1>
            <br>
            <button onclick="startGame('wizard')">wizard</button>
            <button onclick="startGame('bowshooter')">bowshooter</button>
            <button onclick="startGame('swordfighter')">swordfighter</button>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" style="display: none;">
            <h1>battle arena</h1>
            <br>
            <p><b>player:</b> <span id="player-name"></span> (hp: <span id="player-hp"></span>) [heals left: <span id="player-heals-count"></span>]</p>
            <p><b>enemy:</b> <span id="enemy-name"></span> (hp: <span id="enemy-hp"></span>) [heals left: <span id="enemy-heals-count"></span>]</p>
            <br>
            <hr>
            <div id="log" style="width: 300px; text-align: left;"></div>
            <hr>
            <br>
            <div id="action-buttons">
                <button onclick="playerAction('attack')">attack</button>
                <button onclick="playerAction('special')">special</button>
                <button id="heal-btn" onclick="playerAction('heal')">heal</button>
            </div>
            <br>
            <button id="restart-btn" style="display: none;" onclick="resetGame()">play again</button>
        </div>
    </center>

    <script>
        var classStats = {
            wizard: { hp: 80, attack: 12, special: 25, heal: 15 },
            bowshooter: { hp: 100, attack: 15, special: 22, heal: 10 },
            swordfighter: { hp: 120, attack: 18, special: 20, heal: 8 }
        };

        var player, enemy, isBattleOver;

        function startGame(chosenClass) {
            player = { 
                name: chosenClass, 
                hp: classStats[chosenClass].hp, 
                maxHp: classStats[chosenClass].hp, 
                attack: classStats[chosenClass].attack, 
                special: classStats[chosenClass].special, 
                heal: classStats[chosenClass].heal,
                healsLeft: 3 // Player can only heal 3 times
            };
            
            var classes = ['wizard', 'bowshooter', 'swordfighter'];
            var randomClass = classes[Math.floor(Math.random() * classes.length)];
            enemy = { 
                name: 'evil ' + randomClass, 
                hp: classStats[randomClass].hp, 
                maxHp: classStats[randomClass].hp, 
                attack: classStats[randomClass].attack, 
                special: classStats[randomClass].special, 
                heal: classStats[randomClass].heal,
                healsLeft: 3 // Enemy can only heal 3 times
            };

            isBattleOver = false;
            document.getElementById('log').innerHTML = '<p>battle started against ' + enemy.name + '</p>';
            document.getElementById('action-buttons').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('heal-btn').disabled = false;
            
            updateUi();

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('battle-screen').style.display = 'block';
        }

        function updateUi() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-hp').innerText = player.hp + '/' + player.maxHp;
            document.getElementById('player-heals-count').innerText = player.healsLeft;

            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-hp').innerText = enemy.hp + '/' + enemy.maxHp;
            document.getElementById('enemy-heals-count').innerText = enemy.healsLeft;

            // Disable player heal button permanently if out of heals
            if (player.healsLeft <= 0) {
                document.getElementById('heal-btn').disabled = true;
            }
        }

        function logMessage(msg) {
            document.getElementById('log').innerHTML += '<p>' + msg + '</p>';
        }

        function playerAction(type) {
            if (isBattleOver) return;

            if (type === 'attack') {
                enemy.hp = Math.max(0, enemy.hp - player.attack);
                logMessage('you attacked for ' + player.attack + ' damage.');
            } else if (type === 'special') {
                enemy.hp = Math.max(0, enemy.hp - player.special);
                logMessage('you used special for ' + player.special + ' damage.');
            } else if (type === 'heal') {
                if (player.healsLeft > 0) {
                    player.hp = Math.min(player.maxHp, player.hp + player.heal);
                    player.healsLeft--;
                    logMessage('you healed for ' + player.heal + ' hp.');
                } else {
                    logMessage('you have no heals left!');
                    return; // Don't trigger enemy turn if action failed
                }
            }

            updateUi();
            if (checkBattleStatus()) return;

            enemyTurn();
        }

        function enemyTurn() {
            if (isBattleOver) return;

            var choices = ['attack', 'special', 'heal'];
            var choice = choices[Math.floor(Math.random() * choices.length)];

            // If enemy tries to heal but has none left, force it to attack instead
            if (choice === 'heal' && enemy.healsLeft <= 0) {
                choice = 'attack';
            }

            if (choice === 'attack') {
                player.hp = Math.max(0, player.hp - enemy.attack);
                logMessage(enemy.name + ' attacked for ' + enemy.attack + ' damage.');
            } else if (choice === 'special') {
                player.hp = Math.max(0, player.hp - enemy.special);
                logMessage(enemy.name + ' used special for ' + enemy.special + ' damage.');
            } else if (choice === 'heal') {
                enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemy.heal);
                enemy.healsLeft--;
                logMessage(enemy.name + ' healed for ' + enemy.heal + ' hp.');
            }

            updateUi();
            checkBattleStatus();
        }

        function checkBattleStatus() {
            if (enemy.hp <= 0) {
                logMessage('victory! you won.');
                endBattle();
                return true;
            }
            if (player.hp <= 0) {
                logMessage('defeat! you lost.');
                endBattle();
                return true;
            }
            return false;
        }

        function endBattle() {
            isBattleOver = true;
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'inline';
        }

        function resetGame() {
            document.getElementById('battle-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
        }
    </script>
</body>
</html>
