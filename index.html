<!DOCTYPE html>
<html>
<head>
    <title>Hello, World?</title>
</head>
<body>
    <center>
        <!-- Character Selection Screen -->
        <div id="selection-screen">
            <h1>choose your character</h1>
            <br>
            <button onclick="startGame('wizard')">wizard</button>
            <button onclick="startGame('bowshooter')">bowshooter</button>
            <button onclick="startGame('swordfighter')">swordfighter</button>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" style="display: none;">
            <h1>battle arena</h1>
            <br>
            <p><b>player:</b> <span id="player-name"></span> (hp: <span id="player-hp"></span>) [heals left: <span id="player-heals-count"></span>]</p>
            <p><b>enemy:</b> <span id="enemy-name"></span> (hp: <span id="enemy-hp"></span>) [heals left: <span id="enemy-heals-count"></span>]</p>
            <br>
            <hr>
            <div id="log" style="width: 300px; text-align: left;"></div>
            <hr>
            <br>
            <div id="action-buttons">
                <button onclick="playerAction('attack')">attack</button>
                <button onclick="playerAction('special')">special</button>
                <button id="heal-btn" onclick="playerAction('heal')">heal</button>
            </div>
            <br>
            <button id="restart-btn" style="display: none;" onclick="resetGame()">play again</button>
        </div>
    </center>

    <script>
        var classStats = {
            wizard: { hp: 80, attack: 12, special: 25, heal: 15 },
            bowshooter: { hp: 100, attack: 15, special: 22, heal: 10 },
            swordfighter: { hp: 120, attack: 18, special: 20, heal: 8 }
        };

        var player, enemy, isBattleOver;

        function startGame(chosenClass) {
            player = { 
                name: chosenClass, 
                hp: classStats[chosenClass].hp, 
                maxHp: classStats[chosenClass].hp,
                heals: 3 
            };

            // Filter de gekozen klasse van de speler weg voor de computer
            var availableClasses = Object.keys(classStats).filter(function(c) {
                return c !== chosenClass;
            });
            var randomEnemyClass = availableClasses[Math.floor(Math.random() * availableClasses.length)];

            enemy = { 
                name: randomEnemyClass, 
                hp: classStats[randomEnemyClass].hp, 
                maxHp: classStats[randomEnemyClass].hp,
                heals: 3 
            };

            isBattleOver = false;
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('battle-screen').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'block';
            
            updateUI();
            logMessage('Battle started! You (' + player.name + ') vs Computer (' + enemy.name + ')');
        }

        function updateUI() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-hp').innerText = player.hp;
            document.getElementById('player-heals-count').innerText = player.heals;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-hp').innerText = enemy.hp;
            document.getElementById('enemy-heals-count').innerText = enemy.heals;
        }

        function logMessage(msg) {
            var logDiv = document.getElementById('log');
            logDiv.innerHTML += '<p>' + msg + '</p>';
        }

        function playerAction(action) {
            if (isBattleOver) return;

            // Speler acties
            if (action === 'attack') {
                var damage = classStats[player.name].attack;
                enemy.hp -= damage;
                logMessage('<b>' + player.name + '</b> attacks for ' + damage + ' damage.');
            } 
            else if (action === 'special') {
                var damage = classStats[player.name].special;
                enemy.hp -= damage;
                logMessage('<b>' + player.name + '</b> uses SPECIAL for ' + damage + ' damage!');
            } 
            else if (action === 'heal') {
                if (player.heals > 0) {
                    var healAmount = classStats[player.name].heal;
                    player.hp = Math.min(player.maxHp, player.hp + healAmount);
                    player.heals--;
                    logMessage('<b>' + player.name + '</b> heals for ' + healAmount + ' HP.');
                } else {
                    logMessage('No heals left!');
                    return; // Stop actie als genezen niet kan
                }
            }

            checkWin();
            
            // Als de vijand nog leeft, slaat deze direct terug
            if (!isBattleOver) {
                enemyTurn();
            }
            
            updateUI();
        }

        function enemyTurn() {
            // De computer kiest willekeurig tussen een normale aanval of genezen (als hp laag is)
            if (enemy.hp < (enemy.maxHp * 0.4) && enemy.heals > 0 && Math.random() > 0.5) {
                var healAmount = classStats[enemy.name].heal;
                enemy.hp = Math.min(enemy.maxHp, enemy.hp + healAmount);
                enemy.heals--;
                logMessage('<i>' + enemy.name + '</i> heals for ' + healAmount + ' HP.');
            } else {
                var damage = classStats[enemy.name].attack;
                player.hp -= damage;
                logMessage('<i>' + enemy.name + '</i> attacks back for ' + damage + ' damage.');
            }
            
            checkWin();
        }

        function checkWin() {
            if (enemy.hp <= 0) {
                enemy.hp = 0;
                logMessage('<h3> You win</h3>');
                endGame();
            } else if (player.hp <= 0) {
                player.hp = 0;
                logMessage('<h3> You lose</h3>');
                endGame();
            }
        }

        function endGame() {
            isBattleOver = true;
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'inline-block';
        }

        function resetGame() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('battle-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
        }
    </script>
</body>
</html>
